<template>
    <!-- Loading state -->
    <template lwc:if={isLoading}>
        <div class="slds-is-relative slds-p-around_large">
            <lightning-spinner alternative-text="Loading partners..." size="medium"></lightning-spinner>
        </div>
    </template>

    <!-- Error state -->
    <template lwc:elseif={errorMessage}>
        <div class="slds-p-around_medium">
            <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                <lightning-icon icon-name="utility:error" alternative-text="Error"
                    size="x-small" class="slds-m-right_x-small"></lightning-icon>
                {errorMessage}
            </div>
        </div>
    </template>

    <!-- Main content -->
    <template lwc:else>
        <div class="slds-p-around_medium">

            <!-- Regional / Preferred Partners Section -->
            <div class="rtp-section slds-m-bottom_medium">
                <div class="rtp-section__header">
                    <span class="slds-text-heading_small rtp-section__title">Preferred Refer To Partner</span>
                    <span class="rtp-section__count">{preferredItemsLabel}</span>
                </div>
                <div class="rtp-section__body">
                    <template lwc:if={hasPreferredAccounts}>
                        <div class="slds-p-horizontal_small slds-p-top_x-small">
                            <lightning-input
                                type="search"
                                placeholder="Search..."
                                value={searchTermPreferred}
                                onchange={handlePreferredSearch}
                                variant="label-hidden"
                                label="Search Regional Partners"
                            ></lightning-input>
                        </div>
                        <lightning-datatable
                            key-field="id"
                            data={filteredPreferredAccounts}
                            columns={columns}
                            selected-rows={selectedIds}
                            onrowselection={handleRowSelection}
                        ></lightning-datatable>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-color_weak slds-p-around_small">No regional partners found for this lead&apos;s country.</p>
                    </template>
                </div>
            </div>

            <!-- Other Partners (collapsible) -->
            <template lwc:if={hasOtherAccounts}>
                <div class="rtp-section slds-m-bottom_medium">
                    <button class="rtp-section__header rtp-section__header--toggle"
                        onclick={toggleOtherAccounts}>
                        <lightning-icon icon-name={otherSectionIcon} size="x-small"
                            class="slds-m-right_x-small"></lightning-icon>
                        <span class="slds-text-heading_small rtp-section__title">All Accounts</span>
                        <span class="rtp-section__count">{otherItemsLabel}</span>
                    </button>
                    <template lwc:if={showOtherAccounts}>
                        <div class="rtp-section__body">
                            <div class="slds-p-horizontal_small slds-p-top_x-small">
                                <lightning-input
                                    type="search"
                                    placeholder="Search..."
                                    value={searchTermOther}
                                    onchange={handleOtherSearch}
                                    variant="label-hidden"
                                    label="Search All Accounts"
                                ></lightning-input>
                            </div>
                            <lightning-datatable
                                key-field="id"
                                data={filteredOtherAccounts}
                                columns={columns}
                                selected-rows={selectedIds}
                                onrowselection={handleRowSelection}
                            ></lightning-datatable>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Comments -->
            <div class="slds-m-top_medium">
                <lightning-textarea
                    label="Comments (optional)"
                    value={comments}
                    onchange={handleCommentChange}
                    max-length="2000"
                    placeholder="Add a personal note for the partner..."
                ></lightning-textarea>
            </div>

            <!-- Selection summary -->
            <template lwc:if={hasSelections}>
                <p class="slds-text-color_weak slds-m-top_x-small">
                    {selectedCount} partner(s) selected
                </p>
            </template>
        </div>

        <!-- Footer actions -->
        <div class="slds-modal__footer slds-theme_default">
            <lightning-button
                label="Cancel"
                onclick={handleCancel}
                class="slds-m-right_x-small"
            ></lightning-button>
            <lightning-button
                variant="brand"
                label="Send Referral"
                onclick={handleSubmit}
                disabled={isSubmitDisabled}
            ></lightning-button>
        </div>
    </template>
</template>
